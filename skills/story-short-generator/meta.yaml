summary-en: Turn a story idea into a complete, coherent short film — brief, outline, single-view character/scene/prop cards, seven-column shot table, storyboard, per-shot video and final assembly — in any of seven built-in visual styles.
summary-cn: 根据故事创意完成角色/场景/道具设定、镜头规划、分镜生成与视频合成，输出风格统一的短片；内置皮克斯感 3D / 电影真人写实 / 吉卜力 2D 手绘 / 日式二次元赛璐璐 / 水墨东方古风 / 欧美漫画半调 / 国风仙侠 3D 七套视觉风格。
desc-en: Turns a short story idea into a stylized short film in one of seven built-in visual styles (Pixar-like 3D, cinematic live-action, Ghibli-style 2D, Japanese cel-shaded anime, Chinese ink-wash, American comic halftone, Chinese Guofeng xianxia 3D). It builds the brief, outline, single-view character / scene / prop cards, seven-column continuity-safe shot table (with a `续接`/continuation column), text storyboard, single-shot clips, assembly, and final quality review. The default video workflow comes from the capability registry (currently MiniMax-H3); another workflow is used only after the user explicitly selects it and its capabilities are checked. Reference-image shape is gated on the `fast` tier, which is the only tier where multi-subject references leak into the output. Best for coherent narrative shorts, not single images or unrelated clips.
desc-cn: 面向希望把故事创意制作成完整风格化短片的创作者。开场先选定视觉风格（内置七套）、视频档位、**图片档位（默认 quality）**与交付规格，Skill 依次完成项目简报、故事大纲、单视图角色卡、无人物场景卡、单视图道具卡、连续性镜头表、文本分镜、单镜头视频、成片合成与质量复查。默认使用能力注册表的视频工作流（当前 MiniMax-H3）；用户明确指定其他模型/工作流时先用 comfy_list_workflows 检查能力再执行，失败会按原因重试并切换可用工作流。参考图形态门禁只在 fast 档启用——fast 档下多主体参考图会产生角色副本或画面污染，balanced/quality 实测不触发。适合剧情短片，不适合单图或无关联镜头，强调角色统一与镜头衔接。
